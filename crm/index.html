<meta name="description" content="UI/UX case study: MS Group CRM, an export management platform designed and built by Haddeer.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* responsive pass: tiny phones, short screens, very large screens */
.spec-art{overflow:hidden}
.hg .card{flex-basis:clamp(280px,min(52vw,calc((100svh - 320px)*1.6)),900px)}
.hg .card.ph{flex-basis:clamp(150px,min(17vw,calc((100svh - 330px)*.46)),280px)}
.dec-stage{max-width:calc((100svh - 22vh)*1.5)}
.fps .screen .browser .vp{height:min(72svh,680px)}
@media (max-width:600px){.hud .pill-btn.keep{display:none}.pill-btn{padding:10px 12px;font-size:10px}}
@media (max-width:420px){.cv-foot{grid-template-columns:1fr}.ov-figs{grid-template-columns:1fr 1fr}.big{font-size:clamp(58px,17vw,76px)}.lrn li{grid-template-columns:1fr}.qflow{grid-template-columns:1fr 1fr}.parade{grid-template-columns:repeat(2,minmax(0,1fr))}.lineup{grid-template-columns:1fr}.lineup .lp:nth-child(n+3){display:none}.flav,.toks{grid-template-columns:1fr}.specs{grid-template-columns:1fr}.months button{padding:8px 7px}}
@media (max-height:620px) and (min-width:900px){.film .copy,.film .counter{bottom:90px}.hg .hg-head h2{font-size:clamp(30px,3vw,48px)}}
@media (min-width:1800px){:root{--wrap:1560px}body{font-size:18px}.lead{font-size:23px}}
@media (min-width:2400px){:root{--wrap:1880px}body{font-size:20px}.d2{font-size:clamp(50px,8vw,170px)}.d3{font-size:96px}.lead{font-size:26px}.mono{font-size:13px}}
.wfm{min-width:0}.wfm .fx{flex-wrap:wrap}.wfm .fx>.bx{min-width:0}.wfm .t{flex-wrap:wrap;gap:6px}

/* simple cover */
.cv2{background:var(--forest-2);color:var(--on-dark);overflow:hidden}
.cv2 .wrap{padding-top:clamp(22px,3vw,36px)}
.cv2-mid{display:grid;gap:clamp(18px,2.4vw,28px);justify-items:center;text-align:center;padding-top:clamp(64px,9vw,130px)}
.cv2-h{font-size:clamp(56px,9.5vw,160px);line-height:.9;letter-spacing:-.03em}
.cv2-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:clamp(44px,5vw,72px) auto 0;max-width:980px;border-top:1px solid var(--line-dark)}
.cv2-meta div{padding:16px 12px 0;display:grid;gap:6px;text-align:center}
.cv2-meta dt{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2)}
.cv2-meta dd{margin:0;font-size:15px}
.cv2-shot{max-width:1120px;margin:clamp(48px,6vw,90px) auto 0;margin-bottom:calc(-1 * clamp(80px,14vw,240px))}
.cv2-shot .browser{box-shadow:0 -10px 60px -10px rgba(198,246,141,.12),0 40px 100px -30px rgba(0,0,0,.6)}
.cv2+section{position:relative;z-index:1}
@media (max-width:700px){.cv2-meta{grid-template-columns:1fr 1fr;row-gap:18px}.cv2-shot{margin-bottom:-40px}}
</style>

<style>
/* Layout concept: a film in chapters. Full-bleed photographic "plates" (scroll-pinned, parallax) alternate with quiet ivory spreads set like a printed monograph. Brand forest + lime carry everything; Instrument Serif speaks, mono annotates. */
:root{
  --forest:#0f3d1e; --forest-2:#08240f; --forest-3:#143a21; --night:#051a0b;
  --ivory:#f5f0e6; --paper:#fbf8f1; --sand:#ebe3d2;
  --ink:#16221a; --muted:#5d685a; --line:#d8cfbb;
  --lime:#c7f78a; --olive:#6f9640; --mint:#dff0cf;
  --on-dark:#eef2e6; --on-dark-2:#9fb19a; --line-dark:rgba(238,242,230,.14);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-brand:"DM Serif Display",Georgia,serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wrap:1320px; --gut:max(16px, env(safe-area-inset-left,0px)); --gutr:max(16px, env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.16,.84,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--night)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px;border-radius:4px}
.dk :focus-visible{outline-color:var(--lime)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:.95;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.band{position:relative;padding-left:var(--gut);padding-right:var(--gutr)}
.wrap{max-width:var(--wrap);margin:0 auto;position:relative}
.dk{background:var(--forest-2);color:var(--on-dark)}
.fo{background:var(--forest);color:var(--on-dark)}
.pp{background:var(--paper)}
.sd{background:var(--sand)}
.pad{padding-block:clamp(88px,12vw,180px)}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.em{font-style:italic;color:var(--olive)}
.dk .em,.fo .em,.plate .em{color:var(--lime)}
.quiet{color:var(--muted)}
.dk .quiet,.fo .quiet,.plate .quiet{color:var(--on-dark-2)}
.ch{display:flex;align-items:baseline;gap:14px;color:var(--olive)}
.dk .ch,.fo .ch,.plate .ch{color:var(--lime)}
.ch b{font-weight:500}
.ch i{flex:0 0 48px;height:1px;background:currentColor;opacity:.5;align-self:center}
.ch span{color:var(--muted)}
.dk .ch span,.fo .ch span,.plate .ch span{color:var(--on-dark-2)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid currentColor;border-radius:999px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dk .tag,.fo .tag,.plate .tag{color:var(--on-dark-2)}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--olive)}
.dk .tag::before,.fo .tag::before,.plate .tag::before{background:var(--lime)}
.d1{font-size:clamp(68px,13vw,236px);line-height:.84;letter-spacing:-.03em}
.d2{font-size:clamp(50px,8vw,136px);line-height:.88;letter-spacing:-.025em}
.d3{font-size:clamp(38px,5vw,80px);line-height:.92}
.d4{font-size:clamp(28px,2.8vw,40px);line-height:1}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.5;max-width:44ch}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:var(--noise);z-index:2}
.ghost{position:absolute;font-family:var(--f-display);font-size:clamp(200px,32vw,560px);line-height:.7;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none;user-select:none;z-index:0}
.dk .ghost,.fo .ghost{-webkit-text-stroke-color:rgba(238,242,230,.08)}

/* frames */
.browser{border-radius:12px;overflow:hidden;background:#0b1c10;box-shadow:0 2px 0 rgba(255,255,255,.04) inset,0 50px 100px -40px rgba(4,20,8,.75),0 18px 40px -20px rgba(4,20,8,.5)}
.browser .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#10261a}
.browser .bar span{width:8px;height:8px;border-radius:50%;background:#2c4733}
.browser .bar em{margin:0 auto;font-style:normal;font:400 10.5px var(--f-mono);color:#7f9785;background:#0b1c10;border-radius:999px;padding:3px 14px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{width:100%;border-radius:15%/7%;padding:3.2%;background:#0a170e;box-shadow:inset 0 0 0 1.5px #2a3e2f,0 50px 90px -40px rgba(4,20,8,.8)}
.phone img{border-radius:12%/5.6%;width:100%;aspect-ratio:390/844;object-fit:cover;object-position:top}
.tablet{width:100%;border-radius:6%/4.2%;padding:3%;background:#0a170e;box-shadow:inset 0 0 0 1.5px #2a3e2f,0 50px 90px -40px rgba(4,20,8,.8)}
.tablet img{border-radius:3%/2%;width:100%;aspect-ratio:664/955;object-fit:cover;object-position:top}
.tilt-l{transform:perspective(2200px) rotateY(16deg) rotateX(4deg);transform-origin:left center}
.tilt-r{transform:perspective(2200px) rotateY(-16deg) rotateX(4deg);transform-origin:right center}
figure{margin:0}
figcaption.cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.dk figcaption.cap,.fo figcaption.cap,.plate figcaption.cap{color:var(--on-dark-2)}
figcaption.cap b{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
.dk figcaption.cap b,.fo figcaption.cap b{color:var(--lime)}

/* reveal: visible at rest; animates only for elements entering later */
.rv.in{animation:rise 1.1s var(--ease) both}
.clip.in{animation:unclip 1.4s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes unclip{from{clip-path:inset(18% 8% 18% 8% round 14px);transform:scale(1.06)}to{clip-path:inset(0 0 0 0 round 0);transform:none}}

/* chrome */
.topbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;z-index:70;pointer-events:none}
.topbar b{display:block;height:100%;width:0;background:var(--lime)}
.hud{position:fixed;z-index:71;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.hud>*{pointer-events:auto}
.pill-btn{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(199,247,138,.35);background:rgba(5,26,11,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--on-dark);border-radius:999px;padding:12px 16px;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.pill-btn:hover{border-color:var(--lime);color:var(--lime)}
.pill-btn .cur{color:var(--lime)}
.export .hud .pill-btn:not(.keep),.export .topbar{display:none}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(5,26,11,.97);color:var(--on-dark);padding:max(28px,env(safe-area-inset-top,0px)) var(--gutr) 28px var(--gut);overflow:auto;animation:fadein .35s var(--ease)}
@keyframes fadein{from{opacity:0}}
.sheet .wrap{display:grid;gap:28px}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 32px}
.sheet a{display:flex;gap:16px;align-items:baseline;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line-dark);font-family:var(--f-display);font-size:26px;line-height:1.1}
.sheet a b{font:500 11px var(--f-mono);color:var(--lime);min-width:24px}
.sheet a:hover{color:var(--lime)}

/* 01 cover */
.cover{min-height:min(980px,96svh);display:flex;overflow:hidden;background:var(--night);color:var(--on-dark)}
.cover .bg{position:absolute;inset:-6% 0;background:url(img/scene-tropical.webp) 62% center/cover;animation:kenburns 22s ease-out both;will-change:transform}
@keyframes kenburns{from{transform:scale(1.18)}to{transform:scale(1.02)}}
.cover .shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 40%,transparent 0%,rgba(5,26,11,.25) 40%,rgba(5,26,11,.9) 78%),linear-gradient(0deg,rgba(5,26,11,.95) 0%,transparent 45%)}
.cover .wrap{width:100%;display:flex;flex-direction:column;padding-block:clamp(22px,3vw,36px) clamp(40px,5vw,64px);z-index:3}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.cv-top img{height:clamp(30px,3vw,42px);width:auto}
.cv-mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(22px,3vw,40px);padding-top:clamp(120px,16vw,220px)}
.cover h1 span{display:block}
.cover h1 .em{margin-left:clamp(40px,9vw,170px)}
.cv-foot{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid var(--line-dark);padding-top:20px;align-items:start}
.cv-foot dl{margin:0;display:grid;gap:6px}
.cv-foot dt{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2)}
.cv-foot dd{margin:0;font-size:15px}
@media (max-width:860px){.cv-foot{grid-template-columns:1fr 1fr}.cv-foot .lead{grid-column:1/-1}}
.floaty{position:absolute;z-index:3;filter:drop-shadow(0 40px 40px rgba(0,0,0,.5));will-change:transform;pointer-events:none}
@media (max-width:860px){.floaty{display:none}}

/* 02 overview */
.ov{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(40px,7vw,120px);align-items:end}
.ov-figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:clamp(48px,6vw,80px)}
.ov-figs div{border-top:1px solid var(--ink);padding:16px 18px 28px 0;display:grid;gap:6px}
.big{font-family:var(--f-display);font-size:clamp(76px,9vw,150px);line-height:.8;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov-img{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:2px}
.ov-img img{width:100%;height:118%;object-fit:cover;position:absolute;top:-9%}
.pages{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.pages span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px 12px 0;color:var(--muted)}
.pages span+span::before{content:"/";margin-right:16px;color:var(--line)}
@media (max-width:900px){.ov{grid-template-columns:1fr}}

/* 03 context mosaic */
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(70px,8vw,120px);gap:clamp(8px,1vw,14px)}
.mosaic figure{position:relative;overflow:hidden;border-radius:3px}
.mosaic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.mosaic figure:hover img{transform:scale(1.05)}
.mosaic figcaption{position:absolute;left:12px;bottom:10px;font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.lines3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(56px,7vw,96px)}
.lines3 div{display:grid;gap:10px;border-top:1px solid var(--line-dark);padding-top:18px}
@media (max-width:860px){.mosaic{grid-auto-rows:64px}.mosaic figure{grid-column:span 6!important;grid-row:span 3!important}.mosaic figure:first-child{grid-column:span 12!important}.lines3{grid-template-columns:1fr}}

/* 04 problem */
.hmw{font-family:var(--f-display);font-size:clamp(44px,7.2vw,124px);line-height:.92;letter-spacing:-.025em;max-width:16ch;margin:0}
.tens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(64px,8vw,120px)}
.tens div{display:grid;gap:10px;align-content:start}
.tens .pair{font-family:var(--f-display);font-size:clamp(34px,3.4vw,52px);line-height:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tens .pair i{font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:4px 8px;font-style:normal}
.tens p{font-size:15px;color:var(--muted);max-width:34ch}
@media (max-width:860px){.tens{grid-template-columns:1fr}}

/* 05 goals over plate */
.plate{position:relative;overflow:hidden;color:var(--on-dark);background:var(--night)}
.plate .pbg{position:absolute;inset:-12% 0;background-size:cover;background-position:center;will-change:transform}
.plate .pshade{position:absolute;inset:0}
.plate .wrap{z-index:3}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(56px,7vw,100px)}
.goal{border-left:1px solid var(--line-dark);padding:4px clamp(14px,2vw,28px) 8px;display:grid;gap:14px;align-content:start}
.goal .gk{font-family:var(--f-display);font-size:clamp(34px,3.4vw,52px);line-height:.95}
.goal p{font-size:14.5px;color:var(--on-dark-2)}
.goal .by{margin-top:10px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime);line-height:1.6}
@media (max-width:980px){.goals{grid-template-columns:1fr 1fr;row-gap:36px}}
@media (max-width:560px){.goals{grid-template-columns:1fr}}

/* 06 benchmark matrix */
.mx{display:grid;border-top:1px solid var(--ink)}
.mx-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,48px);padding:clamp(20px,2.4vw,30px) 0;border-bottom:1px solid var(--line);align-items:center}
.mx-row h3{font-size:clamp(28px,2.8vw,42px)}
.mx-typ{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14.5px}
.mx-typ::before{content:"";flex:0 0 10px;height:10px;border-radius:50%;border:1.5px solid #a7ad9f}
.mx-ms{display:flex;align-items:center;gap:14px;font-size:14.5px}
.mx-ms b{flex:0 0 auto;background:var(--forest);color:var(--lime);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
.mx-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,48px);padding-bottom:14px}
@media (max-width:860px){.mx-row,.mx-head{grid-template-columns:1fr}.mx-head span:not(:first-child){display:none}.mx-ms{flex-wrap:wrap}}

/* 07 audience */
.who{display:grid;gap:0}
.who span{font-family:var(--f-display);font-size:clamp(54px,9vw,156px);line-height:.92;letter-spacing:-.03em;display:flex;align-items:baseline;gap:20px;border-bottom:1px solid var(--line);padding-block:4px 10px;transition:color .4s,padding .5s var(--ease)}
.who span small{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--olive);text-transform:uppercase}
.who span:hover{color:var(--olive);padding-left:24px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 32px;margin-top:clamp(56px,6vw,88px)}
.qs div{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line);font-size:15.5px}
.qs b{font:500 11px var(--f-mono);color:var(--olive);padding-top:4px}

/* 08 IA */
.ia{overflow-x:auto;padding-bottom:6px;margin-top:clamp(40px,6vw,72px)}
.tree{min-width:900px;display:grid;justify-items:center}
.node{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:12px 20px;border-radius:999px;border:1px solid var(--line-dark);font-size:15px;white-space:nowrap;background:rgba(238,242,230,.03)}
.node small{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2)}
.node.root{background:var(--lime);color:var(--forest-2);border:0;font-weight:600;padding:14px 28px}
.node.root small{color:var(--forest)}
.node.cta{border:1.5px dashed var(--lime);color:var(--lime)}
.row{display:flex;justify-content:center;gap:40px;position:relative;padding-top:34px;margin-top:34px}
.row::before{content:"";position:absolute;top:0;left:16%;right:13%;height:1px;background:var(--line-dark)}
.row::after{content:"";position:absolute;top:-34px;left:50%;width:1px;height:34px;background:var(--line-dark)}
.col{display:flex;flex-direction:column;align-items:center;position:relative}
.col::before{content:"";position:absolute;top:-34px;left:50%;width:1px;height:34px;background:var(--line-dark)}
.subs{display:flex;gap:8px;margin-top:14px}
.subs .node{padding:8px 14px;font-size:13px}
.anc{margin-top:10px;font:400 10.5px var(--f-mono);color:var(--on-dark-2);text-align:center;line-height:1.7}
.flow{margin-top:clamp(64px,8vw,110px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s}
.flow div{position:relative;padding:28px 18px 0 0;border-top:1px solid var(--line-dark);display:grid;gap:8px;align-content:start}
.flow div::before{content:"";position:absolute;top:-6px;left:0;width:11px;height:11px;border-radius:50%;background:var(--forest-2);border:1.5px solid var(--lime)}
.flow div:last-child::before{background:var(--lime)}
.flow h3{font-size:clamp(30px,2.8vw,42px)}
.flow span{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
@media (max-width:900px){.flow{grid-template-columns:1fr 1fr;row-gap:36px}}

/* 09 decisions sticky */
.dec{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,80px);align-items:start}
.dec-list{display:grid}
.dec-item{min-height:62vh;display:grid;align-content:center;gap:16px;padding-block:20px;opacity:.3;transition:opacity .6s var(--ease)}
.dec-item.on{opacity:1}
.dec-item .k{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--olive)}
.dec-item h3{font-size:clamp(38px,4.2vw,66px)}
.dec-item p{color:var(--muted);max-width:40ch;font-size:16px}
.dec-item p b{font-weight:600;color:var(--ink)}
.dec-item .inl{display:none}
.dec-stage{position:sticky;top:max(12vh,60px)}
.dec-stage .frames{position:relative;aspect-ratio:16/10.6}
.dec-stage .frames>*{position:absolute;inset:0;opacity:0;transform:translateY(24px) scale(.97);transition:opacity .7s var(--ease),transform .9s var(--ease)}
.dec-stage .frames>.on{opacity:1;transform:none}
.dec-count{display:flex;gap:6px;margin-top:22px}
.dec-count i{height:2px;flex:1;background:var(--line)}
.dec-count i.on{background:var(--forest)}
@media (max-width:980px){.dec{grid-template-columns:1fr}.dec-stage{display:none}.dec-item{min-height:0;opacity:1;padding-block:28px;border-top:1px solid var(--line)}.dec-item .inl{display:block;margin-top:10px}}

/* 10 compare */
.cmp{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:12px;box-shadow:0 50px 100px -40px rgba(4,20,8,.6);user-select:none;touch-action:pan-y}
.cmp>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.wire{position:absolute;inset:0;background-color:var(--paper);background-image:linear-gradient(var(--sand) 1px,transparent 1px),linear-gradient(90deg,var(--sand) 1px,transparent 1px);background-size:24px 24px;clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.w{position:absolute;border:1.5px solid #8e9889;border-radius:6px;background:rgba(251,248,241,.9)}
.w.f{background:#d6d0bf;border-color:#b3ad9c}
.w.p{border-radius:999px}
.w .lb{position:absolute;left:8px;bottom:6px;font:500 9.5px var(--f-mono);letter-spacing:.06em;color:#727b6d;text-transform:uppercase;white-space:nowrap}
.wx{position:absolute;inset:8% 0 0 0;border-top:1.5px dashed #b6b9ab}
.wx::before,.wx::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),#c3c4b6 50%,transparent calc(50% + 1px))}
.wx::after{transform:scaleX(-1)}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--lime);transform:translateX(-1px);z-index:3}
.cmp .handle span{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;background:var(--lime);transform:translate(-50%,-50%);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--forest-2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0}
.cmp-l{position:absolute;top:16px;z-index:3;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.wf-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,24px);margin-top:clamp(20px,2vw,28px)}
.wfm{background-color:var(--paper);background-image:linear-gradient(var(--sand) 1px,transparent 1px),linear-gradient(90deg,var(--sand) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:9px;align-content:start}
.wfm .t{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bx{border:1.5px solid #8e9889;border-radius:5px;background:rgba(251,248,241,.9);min-height:12px}
.bx.f{background:#d6d0bf;border-color:#b3ad9c}.bx.l{height:7px;border:0;background:#c3c6ba;border-radius:4px;min-height:0}
.fx{display:flex;gap:8px;align-items:center}
@media (max-width:760px){.wf-mini{grid-template-columns:1fr}}

/* 11 system */
.stripes{display:grid;grid-template-columns:4fr 2fr 1.4fr 1.4fr 1.2fr;height:clamp(300px,34vw,480px);border-radius:4px;overflow:hidden}
.stripes div{padding:clamp(14px,1.6vw,24px);display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:flex .6s var(--ease)}
.stripes .nm{font-family:var(--f-display);font-size:clamp(26px,2.6vw,40px);line-height:1}
.stripes .hx{font:500 11px var(--f-mono);letter-spacing:.06em}
.stripes .rl{font-size:12.5px;opacity:.75;margin-top:6px}
@media (max-width:760px){.stripes{grid-template-columns:1fr;height:auto}.stripes div{min-height:110px}}
.types{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:clamp(14px,2vw,24px);margin-top:clamp(14px,2vw,24px)}
.type{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,2vw,28px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-width:0}
.type .ft{display:flex;justify-content:space-between;gap:12px;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.comps{margin-top:clamp(14px,2vw,24px);border-radius:4px;overflow:hidden;position:relative;background:url(img/scene-farm.webp) center 60%/cover;padding:clamp(24px,4vw,56px);display:grid;gap:22px;justify-items:start}
.comps::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,26,11,.85),rgba(5,26,11,.35))}
.comps>*{position:relative}
@media (max-width:900px){.types{grid-template-columns:1fr}}
.cta-pill{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:#0b2a10;font:600 15px "Inter",var(--f-body);padding:14px 24px;border-radius:999px;border:0;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s}
.cta-pill i{font-style:normal;transition:transform .35s var(--ease)}
.cta-pill:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(199,247,138,.7)}
.cta-pill:hover i{transform:translateX(4px)}
.cta-pill.dkb{background:var(--forest);color:#fff}
.glass{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 10px 10px 20px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;width:min(720px,100%)}
.glass nav{display:flex;gap:24px;font:500 14px "Inter",sans-serif}
@media (max-width:620px){.glass nav{display:none}}
.chips{display:inline-flex;gap:3px;padding:5px;border-radius:999px;background:rgba(5,26,11,.75);border:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.chips button{display:flex;align-items:center;gap:7px;font:500 13px "Inter",sans-serif;color:#d7e2d2;background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .35s,color .35s}
.chips button::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.chips button[aria-pressed="true"]{background:var(--lime);color:#0b2a10}
.tabs{display:inline-flex;gap:3px;padding:5px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(15,61,30,.14)}
.tabs span{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;font:500 14px "Inter",sans-serif;color:var(--ink)}
.tabs span b{font:600 11px var(--f-mono);background:#edf0e8;border-radius:999px;padding:2px 7px}
.tabs span.on{background:var(--forest);color:#fff}.tabs span.on b{background:rgba(255,255,255,.18)}

/* 12 pinned hero film */
.film{position:relative;background:var(--night);color:#fff}
.film .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.film .scn{position:absolute;inset:0;opacity:0;transition:opacity 1.2s var(--ease)}
.film .scn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 7s cubic-bezier(.2,.6,.2,1)}
.film .scn.on{opacity:1}
.film .scn.on img{transform:scale(1)}
.film .scn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,26,11,.78) 0%,rgba(5,26,11,.35) 45%,transparent 70%),linear-gradient(0deg,rgba(5,26,11,.7),transparent 35%)}
.film .copy{position:absolute;z-index:3;left:max(var(--gut),calc((100% - var(--wrap))/2));bottom:clamp(120px,18vh,200px);max-width:min(640px,86vw);display:grid;gap:18px}
.film .copy .eb{font:600 11px "Inter",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d9efc2}
.film .copy h3{font-family:var(--f-brand);font-size:clamp(44px,6vw,92px);line-height:1;letter-spacing:-.01em}
.film .copy h3 em{color:var(--lime);font-style:normal}
.film .copy p{font:400 clamp(15px,1.2vw,18px)/1.55 "Inter",sans-serif;color:#e8eee2;max-width:44ch}
.film .copy .line{transition:opacity .8s var(--ease),transform .9s var(--ease)}
.film .copy.swap .line{opacity:0;transform:translateY(20px)}
.film .hudtop{position:absolute;z-index:4;top:max(22px,env(safe-area-inset-top,0px));left:max(var(--gut),calc((100% - var(--wrap))/2));right:max(var(--gutr),calc((100% - var(--wrap))/2));display:flex;justify-content:space-between;gap:16px;align-items:center}
.film .chipbar{position:absolute;z-index:4;left:0;right:0;bottom:clamp(28px,5vh,48px);display:flex;justify-content:center;padding-inline:16px}
.film .counter{font-family:var(--f-display);font-size:clamp(60px,8vw,128px);line-height:.8;color:rgba(255,255,255,.9);position:absolute;z-index:3;right:max(var(--gutr),calc((100% - var(--wrap))/2));bottom:clamp(120px,18vh,200px);font-variant-numeric:tabular-nums}
.film .counter small{font-size:.35em;color:rgba(255,255,255,.5)}
.film.nopin .stick{position:relative;height:min(860px,92svh)}

/* marquee */
.marq{overflow:hidden;padding-block:clamp(28px,4vw,56px);border-block:1px solid var(--line)}
.marq .tr{display:flex;gap:.5em;white-space:nowrap;font-family:var(--f-display);font-size:clamp(64px,10vw,180px);line-height:1;will-change:transform}
.marq .tr span{display:inline-flex;align-items:center;gap:.5em}
.marq .tr .o{color:transparent;-webkit-text-stroke:1.2px var(--forest)}
.marq .tr img{height:.8em;width:auto}

/* 13 doors */
.doors{display:flex;gap:clamp(6px,.8vw,12px);height:clamp(440px,52vw,720px)}
.door{position:relative;flex:1;min-width:0;overflow:hidden;border-radius:14px;transition:flex 1s var(--ease);cursor:pointer;color:#fff;border:0;padding:0;background:#000;text-align:left;font:inherit}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,20,10,.9),rgba(5,20,10,.1) 55%)}
.door .in{position:absolute;z-index:2;left:clamp(14px,2vw,28px);right:clamp(14px,2vw,28px);bottom:clamp(16px,2vw,28px);display:grid;gap:10px}
.door .nm{font-family:"Oswald",Impact,sans-serif;font-weight:600;text-transform:uppercase;font-size:clamp(22px,2.6vw,54px);line-height:.92;letter-spacing:.005em}
.door .ct{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.door .ds{font-size:14px;color:#dfe7da;max-width:34ch;max-height:0;opacity:0;overflow:hidden;transition:opacity .6s var(--ease),max-height .8s var(--ease)}
.door.on{flex:4.2}
.door.on .ds{max-height:90px;opacity:1}
.door:not(.on) .nm{font-size:clamp(16px,1.4vw,24px)}
@media (max-width:760px){.doors{flex-direction:column;height:auto}.door{flex:none;height:96px}.door.on{flex:none;height:380px}.door:not(.on) .nm{font-size:22px}}
.spec-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:center;margin-top:clamp(80px,10vw,150px)}
.spec-art{position:relative;aspect-ratio:1;display:grid;place-items:center}
.spec-art .disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe0e6,#f6b7c4 60%,#eba0b1);box-shadow:inset 0 -30px 60px rgba(160,40,70,.18)}
.spec-art .ring{position:absolute;inset:2%;border-radius:50%;border:1px dashed rgba(200,60,90,.35);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spec-art img{position:relative;width:74%;filter:drop-shadow(0 40px 40px rgba(120,20,40,.3))}
.spec-art .word{position:absolute;bottom:14%;font-family:var(--f-brand);font-size:clamp(70px,9vw,150px);color:transparent;-webkit-text-stroke:1px rgba(200,60,90,.35);white-space:nowrap}
.sheet-card{background:#fff;border-radius:14px;box-shadow:0 30px 70px -30px rgba(15,61,30,.35);padding:clamp(20px,2.4vw,32px);border-top:3px solid #e2708a}
.sheet-card h4{margin:0 0 6px;font:600 11px "Inter",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6a6a6a}
.sheet-card dl{margin:0;display:grid}
.sheet-card dl div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid #eee;font:400 14px "Inter",sans-serif}
.sheet-card dt{color:#777}.sheet-card dd{margin:0;color:#1d2a20}
@media (max-width:900px){.spec-stage{grid-template-columns:1fr}}

/* 14 nav */
.navx{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,.62fr);gap:clamp(24px,4vw,64px);align-items:end}
.anat{position:relative}
.pin{position:absolute;z-index:3;width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--forest-2);font:600 12px var(--f-mono);display:grid;place-items:center;transform:translate(-50%,-50%);animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(199,247,138,.6)}70%{box-shadow:0 0 0 16px rgba(199,247,138,0)}100%{box-shadow:0 0 0 0 rgba(199,247,138,0)}}
.legend{list-style:none;padding:0;margin:clamp(28px,3vw,40px) 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.legend li{display:grid;gap:6px;border-top:1px solid var(--line-dark);padding-top:14px;font-size:14px;color:var(--on-dark-2)}
.legend li b{font:500 11px var(--f-mono);color:var(--lime)}
.legend li strong{color:var(--on-dark);font-weight:500;font-size:15.5px}
@media (max-width:900px){.navx{grid-template-columns:1fr}.navx>figure{max-width:280px;justify-self:center}.legend{grid-template-columns:1fr 1fr}}

/* 15 responsive */
.resp{position:relative;overflow:hidden;background:var(--night);color:var(--on-dark)}
.resp .pbg{position:absolute;inset:-10% 0;background:url(img/wide-fresh-veg.webp) center/cover;filter:blur(30px) saturate(1.2);opacity:.45;transform:scale(1.15)}
.devs{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.3fr) minmax(0,.82fr);gap:clamp(14px,2.6vw,44px);align-items:end;position:relative;z-index:2}
.devs figure{display:grid}
.devs .lbl{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2);margin-top:18px;border-top:1px solid var(--line-dark);padding-top:10px}
.adapt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(56px,7vw,96px);position:relative;z-index:2}
.adapt div{display:grid;gap:8px}
.adapt p{font-size:14.5px;color:var(--on-dark-2)}
@media (max-width:900px){.devs{grid-template-columns:1fr 1fr}.devs figure:first-child{grid-column:1/-1}.adapt{grid-template-columns:1fr}}

/* 16 horizontal gallery */
.hg{position:relative;background:var(--paper)}
.hg .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,4vh,48px)}
.hg .track{display:flex;gap:clamp(24px,3vw,56px);padding-inline:max(var(--gut),calc((100vw - var(--wrap))/2));will-change:transform;align-items:flex-end}

.hg .card .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:16px}

.hg .card .ttl span{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);white-space:nowrap}
.hg .card.ph h3{font-size:clamp(22px,1.8vw,28px)}
.hg .hg-head{padding-inline:max(var(--gut),calc((100vw - var(--wrap))/2));display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.hg .bar2{height:2px;background:var(--line);margin-inline:max(var(--gut),calc((100vw - var(--wrap))/2))}
.hg .bar2 i{display:block;height:100%;width:0;background:var(--forest)}
.hg.nopin .stick{position:relative;height:auto;padding-block:clamp(88px,12vw,160px)}
.hg.nopin .track{overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;transform:none!important}
.hg.nopin .card{scroll-snap-align:start;flex-basis:min(86vw,560px)}
.hg.nopin .card.ph{flex-basis:200px}

/* 17 motion */
.mo{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(14px,1.6vw,22px)}
.demo{border-radius:6px;background:var(--forest-3);border:1px solid var(--line-dark);overflow:hidden;display:flex;flex-direction:column}
.demo .dh{display:flex;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-dark);align-items:baseline}
.demo .dh h3{font-size:26px}
.demo .dh span{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.demo .db{padding:clamp(18px,2vw,26px);display:grid;gap:16px;flex:1;align-content:center}
.demo p{font-size:13.5px;color:var(--on-dark-2)}
.xf{position:relative;aspect-ratio:16/8;overflow:hidden;border-radius:4px;background:#000}
.xf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:xf 15s infinite}
.xf img:nth-child(2){animation-delay:5s}.xf img:nth-child(3){animation-delay:10s}
@keyframes xf{0%{opacity:0;transform:scale(1.14)}7%{opacity:1}33%{opacity:1;transform:scale(1)}40%{opacity:0}100%{opacity:0}}
.cnts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cnts div{display:grid;gap:4px}
.cnts .big{font-size:clamp(56px,5vw,88px);color:var(--lime)}
.cnts small{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2)}
.months{display:flex;gap:2px;padding:4px;border-radius:999px;background:#fff;overflow-x:auto}
.months button{flex:1 0 auto;border:0;background:transparent;font:500 12.5px "Inter",sans-serif;padding:8px 9px;border-radius:999px;cursor:pointer;color:var(--ink);transition:background .3s,color .3s}
.months button[aria-pressed="true"]{background:var(--forest);color:#fff}
.season{display:flex;flex-wrap:wrap;gap:8px;min-height:86px;align-content:flex-start}

/* 19 showcase */
.sc{position:relative;overflow:hidden;background:var(--night);color:var(--on-dark)}
.sc .pbg{position:absolute;inset:-12% 0;background:url(img/scene-global.webp) center/cover;will-change:transform}
.sc .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,26,11,.9) 0%,rgba(5,26,11,.4) 38%,rgba(5,26,11,.55) 70%,rgba(5,26,11,.95))}
.sc .wrap{z-index:3;padding-block:clamp(88px,11vw,160px)}

.stack3 .s2{width:60%;left:22%;top:0;z-index:2;transform:rotateX(6deg)}
.stack3 .s3{width:52%;right:0;top:24%;z-index:1;transform:rotateY(-20deg) rotateX(6deg);transform-origin:right center}

@media (max-width:760px){.stack3{height:auto;display:grid;gap:16px;perspective:none}.stack3>*{position:relative;width:100%!important;left:auto!important;right:auto!important;top:auto!important;transform:none!important}.stack3 .s1,.stack3 .s3{display:none}.stack3 .s4{width:46%!important;justify-self:center}}

/* 20 thanks */
.ty{min-height:min(860px,92svh);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.ty .wrap{flex:1;display:flex;flex-direction:column;justify-content:space-between;width:100%;padding-block:clamp(72px,9vw,120px) clamp(80px,9vw,120px)}
.ty h2{font-size:clamp(96px,21vw,380px);line-height:.78;letter-spacing:-.04em}
.ty .row3{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--line-dark);padding-top:22px}
.ty a.live{font-family:var(--f-display);font-size:clamp(30px,3.2vw,52px);text-decoration:none;background:linear-gradient(var(--lime),var(--lime)) 0 100%/0 1px no-repeat;transition:background-size .6s var(--ease)}

.sh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:end;margin-bottom:clamp(48px,6vw,96px);position:relative;z-index:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .xf img:first-child{opacity:1}
}

/* ---- v3 additions ---- */
.live-tag{display:inline-flex;align-items:center;gap:8px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#d9efc2}
.live-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5d4f;box-shadow:0 0 0 4px rgba(255,93,79,.25);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* hero film with live captures */
.film .scn img{object-position:center top}
.film .scn::after{background:linear-gradient(180deg,rgba(5,26,11,.55) 0%,transparent 18%,transparent 78%,rgba(5,26,11,.6))}
.film .side{position:absolute;z-index:4;right:max(var(--gutr),calc((100% - var(--wrap))/2));top:50%;transform:translateY(-50%);display:grid;gap:4px}
.film .side button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:12px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:6px 0}
.film .side button i{width:18px;height:2px;background:currentColor;border-radius:2px;transition:width .5s var(--ease)}

.film .scrub{position:absolute;z-index:4;left:max(var(--gut),calc((100% - var(--wrap))/2));right:max(var(--gutr),calc((100% - var(--wrap))/2));bottom:max(22px,env(safe-area-inset-bottom,0px));height:2px;background:rgba(255,255,255,.18)}

/* timeline scrubber */
.tlx{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:center}
.tl-prev{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}

.tl-prev .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.tl{position:relative;margin-top:22px}
.tl .lane{position:relative;height:30px;margin-bottom:6px}
.tl .lane span{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;padding-inline:8px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.tl .lane.sc span{background:rgba(199,247,138,.16);border:1px solid rgba(199,247,138,.4);color:var(--on-dark)}
.tl .lane.tx span{background:rgba(238,242,230,.08);color:var(--on-dark-2);height:16px;top:7px}

.tl .ll{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2);margin:12px 0 6px}

.tl .ax{display:flex;justify-content:space-between;font:400 10px var(--f-mono);color:var(--on-dark-2);margin-top:8px}
.tl-range{width:100%;margin-top:18px;accent-color:#c6f68d}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(48px,6vw,80px);border-top:1px solid var(--line-dark)}
.specs div{padding:18px 18px 0 0;display:grid;gap:6px;align-content:start}

/* videos */
.vid{position:relative;border-radius:12px;overflow:hidden;background:#000}

/* quote flow strip */
.qflow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:clamp(56px,7vw,100px);align-items:start}

.qflow span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2)}

/* palettes */
.flav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin-top:clamp(14px,2vw,24px)}

/* page lineup with auto-scrolling pages */

.lp{display:grid;gap:12px}

.lp .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* pinned full-page homepage scroll */
.fps{position:relative;background:var(--night);color:var(--on-dark)}
.fps .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:clamp(24px,4vw,64px);align-items:center;padding-inline:max(var(--gut),calc((100vw - var(--wrap))/2))}

/* CRM: overview deal ticket */
.tk-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,64px);align-items:center;margin-top:clamp(36px,5vw,72px)}

.tk-head h3{font-family:var(--f-display);font-size:clamp(24px,2.4vw,34px);line-height:1.05;font-weight:400}

.tk-rows{display:grid}

.mn-col{border-radius:18px;background:rgba(238,242,230,.04);box-shadow:inset 0 0 0 1px var(--line-dark);padding:20px 20px 12px;display:grid;gap:14px;align-content:start}

<body>
<div id="app"></div>
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef,Fragment} = React;
const html = htm.bind(React.createElement);
const I = n => `../ms-group/img/${n}.webp`;
const H = n => `hi/${n}.webp`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => innerWidth < 900;

(()=>{try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);document.documentElement.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}})();

const SECTIONS=[['cover','Cover'],['overview','Overview'],['context','Context'],['problem','Problem'],['goals','Goals'],['audience','Roles'],['ia','Journey & IA'],['decisions','Decisions'],['system','Design system'],['modes','Language & theme'],['responsive','Responsive'],['hifi','UI showcase'],['outcomes','Outcomes'],['thanks','Thank you']];
const nn = id => String(SECTIONS.findIndex(s=>s[0]===id)+1).padStart(2,'0');
const lab = id => SECTIONS.find(s=>s[0]===id)[1];

/* scroll engine */
const pinSubs = new Set();
function useScrollEngine(){
  useEffect(()=>{
    if(reduce) return;
    let raf=0;
    const tick=()=>{raf=0; const vh=innerHeight;
      document.querySelectorAll('[data-par]').forEach(el=>{const r=el.parentElement.getBoundingClientRect(); if(r.bottom<-200||r.top>vh+200) return; el.style.transform=`translate3d(0,${((r.top+r.height/2)-vh/2)*(+el.dataset.par)}px,0)`});
      pinSubs.forEach(fn=>fn(vh));
      const h=document.documentElement; const b=document.querySelector('.topbar b'); if(b) b.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
    };
    const on=()=>{if(!raf) raf=requestAnimationFrame(tick)};
    addEventListener('scroll',on,{passive:true}); addEventListener('resize',on); on();
    return()=>{removeEventListener('scroll',on);removeEventListener('resize',on)};
  },[]);
}
function usePin(ref,cb){
  useEffect(()=>{
    const fn=vh=>{const el=ref.current; if(!el||el.classList.contains('nopin')) return; const r=el.getBoundingClientRect(); const span=r.height-vh; const p=span>0?Math.min(1,Math.max(0,-r.top/span)):0; cb(p,el)};
    pinSubs.add(fn); return()=>pinSubs.delete(fn);
  },[]);
}
function usePinnable(){ const [pin,setPin]=useState(!reduce&&!narrow()); useEffect(()=>{const f=()=>setPin(!reduce&&!narrow()); addEventListener('resize',f); return()=>removeEventListener('resize',f)},[]); return pin }

/* shared */
const Ch = ({id,children}) => html`<div class="mono ch"><b>${nn(id)}</b><i></i><span>${children||lab(id)}</span></div>`;
function SH({id,title,lead,tag,sub}){
  return html`<div class="sh">
    <div class="l rv">${id?html`<${Ch} id=${id}>${sub}<//>`:null}<h2 class="d2">${title}</h2></div>
    <div class="r rv">${tag?html`<span class="tag">${tag}</span>`:null}${lead?html`<p class="lead quiet">${lead}</p>`:null}</div>
  </div>`
}
const Browser = ({src,url='MS Group CRM',alt,cls=''}) => html`<div class=${'browser '+cls}><div class="bar"><span></span><span></span><span></span><em>${url}</em></div><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Phone = ({src,alt,cls=''}) => html`<div class=${'phone '+cls}><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Tablet = ({src,alt}) => html`<div class="tablet"><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Band = ({id,cls='',children,label}) => html`<section id=${id} class=${'band '+cls} aria-label=${label||lab(id)}><div class="wrap">${children}</div></section>`;
function Vid({src,poster,label,cls=''}){
  const r=useRef();
  useEffect(()=>{ const v=r.current; if(!v||reduce) return; const o=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ const p=v.play(); p&&p.catch(()=>{}) } else v.pause() },{threshold:.25}); o.observe(v); return()=>o.disconnect()},[]);
  return html`<div class=${'vid '+cls}><span class="live-tag">${label||'Screen recording'}</span><video ref=${r} src=${src} poster=${poster} muted loop playsinline preload="metadata" controls=${reduce} aria-label=${label}></video></div>`
}


const two={display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,440px),1fr))',gap:'clamp(20px,3vw,44px)',alignItems:'start'};
const capS={display:'flex',justifyContent:'space-between',gap:'12px',marginTop:'14px',font:'500 11px var(--f-mono)',letterSpacing:'.12em',textTransform:'uppercase',opacity:.75};

/* 01 cover */
function Cover(){
  return html`<section id="cover" class="band cv2" aria-label="Cover">
    <div class="wrap">
      <div class="cv-top"><img src="../ms-group/hi/logo-white.webp" alt="MS El Brancy Group"/><span class="tag">UI/UX case study</span></div>
      <div class="cv2-mid">
        <span class="mono" style=${{color:'var(--lime)'}}>Export operations · Internal platform</span>
        <h1 class="cv2-h">MS Group <span class="em">CRM</span></h1>
        <p class="lead" style=${{color:'var(--on-dark-2)',margin:'0 auto'}}>One home for an export deal, from the first hello to the last payment.</p>
      </div>
      <dl class="cv2-meta">
        <div><dt>Role</dt><dd>UI/UX design & build</dd></div>
        <div><dt>Built with</dt><dd>Claude Code · React · Supabase</dd></div>
        <div><dt>Duration</dt><dd>1 month</dd></div>
        <div><dt>Status</dt><dd>Live · internal</dd></div>
      </dl>
      <div class="cv2-shot"><${Browser} src=${H('d-dashboard')} alt="MS Group CRM dashboard"/></div>
    </div>
  </section>`
}

/* 02 overview: one deal, six stops */
const STOPS=[['Win the importer','CRM & Importers','d-crm','It starts with a name, a status and a date to call back.'],['Build the price','Pricing','d-pricing','One dated price list, per ton, per kg and per carton.'],['Plan the load','Container Planner','d-planner','Pallets and weight fill up against the container’s limits.'],['Send the quotation','Quotations','d-quote','On the letterhead, in the buyer’s language, saved as a version.'],['Ship the order','Orders & Shipments','d-orders','Every order shows its stage, from packing to arrival.'],['Collect the payment','Payments','d-payments','Advance and balance, due dates and what is still open.']];
function Overview(){
  const [a,setA]=useState(0); const [hold,setHold]=useState(false);
  useEffect(()=>{ if(reduce||hold) return; const t=setTimeout(()=>setA(v=>(v+1)%STOPS.length),3800); return()=>clearTimeout(t)},[a,hold]);
  return html`<${Band} id="overview" cls="pad">
    <div class="rv" style=${{display:'grid',gap:'26px'}}><${Ch} id="overview"/>
      <h2 class="d2" style=${{maxWidth:'16ch'}}>Follow one deal. Meet the <span class="em">whole</span> system.</h2>
      <p class="lead quiet" style=${{maxWidth:'58ch'}}>Selling a container of oranges is six jobs wearing one name. I designed the platform that keeps all six together and built it myself with Claude Code, on React, Tailwind and Supabase, in about a month. Tap a stop on the ticket to see who takes care of it.</p>
    </div>
    <div class="tk-grid" onMouseEnter=${()=>setHold(true)} onMouseLeave=${()=>setHold(false)}>
      <div class="tk rv">
        <div class="tk-head">
          <div class="r"><span class="mono" style=${{color:'var(--lime)'}}>Deal ticket</span><span class="tk-stamp">Demo data</span></div>
          <h3>Valencia Orange · 3 × 40RF</h3>
          <div class="tk-route"><span>Alexandria</span><i></i><span>Hamburg</span></div>
        </div>
        <div class="tk-rows" role="group" aria-label="Stops of one deal">${STOPS.map(([t,m],k)=>html`<button key=${t} aria-pressed=${a===k} onClick=${()=>{setA(k);setHold(true)}} onFocus=${()=>setA(k)}><b>0${k+1}</b><span>${t}</span><em>${m}</em></button>`)}</div>
        <div class="tk-foot">${[['20','Modules'],['7','Roles'],['2','Languages'],['2','Themes']].map(([n,l])=>html`<div key=${l}><b>${n}</b><span>${l}</span></div>`)}</div>
      </div>
      <div class="rv">
        <div class="tk-view">${STOPS.map(([t,m,s],k)=>html`<div key=${t} class=${'fr'+(a===k?' on':'')} aria-hidden=${a!==k}><${Browser} src=${H(s)} url=${m} alt=${a===k?`${m} screen`:''}/></div>`)}</div>
        <div class="tk-cap"><p>${STOPS[a][3]}</p><span>Stop 0${a+1} / 06</span></div>
      </div>
    </div>
  <//>`
}

/* 03 context: one deal, three addresses */
function Context(){
  const [now,setNow]=useState(false); const ref=useRef(); const done=useRef(false);
  useEffect(()=>{ if(reduce) return; const o=new IntersectionObserver(([e])=>{ if(e.isIntersecting&&!done.current){done.current=true; setTimeout(()=>setNow(true),2600)} },{threshold:.55}); o.observe(ref.current); return()=>o.disconnect()},[]);
  const dot={sheet:'#1d6f42',chat:'#7bc66a',note:'#e7c84d'};
  return html`<${Band} id="context" cls="pad dk">
    <${SH} id="context" title=${html`One deal, three <span class="em">addresses</span>.`} lead="The client’s details sat in a spreadsheet. The conversation lived in a chat. The quotation was worked out on paper. Each piece was fine on its own. Nothing held them together."/>
    <div class="cx-switch" role="group" aria-label="Before and now"><button aria-pressed=${!now} onClick=${()=>{done.current=true;setNow(false)}}>Before · scattered</button><button aria-pressed=${now} onClick=${()=>{done.current=true;setNow(true)}}>Now · one record</button></div>
    <div ref=${ref} class=${'cx'+(now?' now':'')}>
      <div class="frag fx-xls" aria-hidden=${now}><span class="lb"><i style=${{background:dot.sheet}}></i>The spreadsheet</span><div class="bar">clients_final_v3.xlsx</div>
        <table><tbody><tr><td>Company</td><td>Country</td><td>Product</td></tr><tr><td>Baltic Fresh</td><td>Netherlands</td><td>Frozen</td></tr><tr class="hl"><td>Nordfrisch</td><td>Germany</td><td>Oranges</td></tr><tr><td>Gulf Harvest</td><td>UAE</td><td>Pomegranate</td></tr><tr><td>Thames Produce</td><td>UK</td><td>Mango</td></tr></tbody></table></div>
      <div class="frag fx-chat" aria-hidden=${now}><span class="lb"><i style=${{background:dot.chat}}></i>The chat</span>
        <p class="in">Hello, can you send a price for oranges, CIF Hamburg?</p><p class="out">Of course. I will send it today.</p><small>3 days later</small><p class="in">Any update on the quotation?</p></div>
      <div class="frag fx-note" aria-hidden=${now}><span class="lb"><i style=${{background:dot.note}}></i>The paper</span>
        <h4>Quotation, oranges</h4><p>15 kg × 80 cartons × 12 pallets</p><p>= 14.4 tons</p><p><s>× 600</s> × 620 per ton</p><p>= 8,928 USD ?</p></div>
      <div class="fx-rec" aria-hidden=${!now}>
        <header><b>Nordfrisch Import GmbH<small>Importer · Hamburg, Germany</small></b><span class="st">Active Customer</span></header>
        <dl>
          <div><i style=${{background:dot.sheet}}></i><dt>Interested in</dt><dd>Valencia Orange</dd></div>
          <div><i style=${{background:dot.chat}}></i><dt>Last contact</dt><dd>Asked for a CIF Hamburg price</dd></div>
          <div><i style=${{background:dot.chat}}></i><dt>Next follow-up</dt><dd>14 Nov · Omar Sales</dd></div>
          <div><i style=${{background:dot.note}}></i><dt>Load plan</dt><dd>12 pallets · 14.4 t net</dd></div>
          <div><i style=${{background:dot.note}}></i><dt>Quotation</dt><dd>Q-2026-0013 · Accepted</dd></div>
        </dl>
        <footer><span><i style=${{background:dot.sheet}}></i>was in the sheet</span><span><i style=${{background:dot.chat}}></i>was in the chat</span><span><i style=${{background:dot.note}}></i>was on paper</span></footer>
      </div>
    </div>
    <p class="cx-note">Illustration · fictional client and figures</p>
    <div class="lines3">${[['What it meant','A split history','To know a client, you had to open three things and remember a fourth.'],['What it meant','Quotations by hand','Every offer was rebuilt from the price sheet, one calculation at a time.'],['What it meant','No single view','Nobody could see where a deal stood without asking someone.']].map(([a,b,c])=>html`<div class="rv" key=${b}><span class="mono" style=${{color:'var(--lime)'}}>${a}</span><h3 class="d4">${b}</h3><p class="quiet" style=${{fontSize:'14.5px'}}>${c}</p></div>`)}</div>
  <//>`
}

/* 04 problem: every question, three half answers */
const ASK=[['Where does the Nordfrisch deal stand?',['A name and a country. No status.','Somewhere above. Keep scrolling.','A total, with a question mark.']],['What price did we quote them last time?',['This month’s price, not the one we sent.','Maybe in a message. Maybe in a photo.','On the desk of whoever wrote it.']],['Who calls them next, and when?',['There is no column for that.','“I will send it today.”','Nothing written down.']]];
function Problem(){
  const [q,setQ]=useState(0); const [n,setN]=useState(reduce?999:0); const [seen,setSeen]=useState(reduce); const box=useRef();
  const text=ASK[q][0]; const done=n>=text.length;
  useEffect(()=>{ if(reduce) return; const o=new IntersectionObserver(([e])=>{ if(e.isIntersecting){setSeen(true);o.disconnect()} },{threshold:.4}); o.observe(box.current); return()=>o.disconnect()},[]);
  useEffect(()=>{ if(reduce||!seen||done) return; const t=setTimeout(()=>setN(v=>v+1),30); return()=>clearTimeout(t)},[n,q,done,seen]);
  const pick=k=>{ if(k===q&&done) return; setQ(k); setN(reduce?999:0)};
  const src=[['#1d6f42','The sheet','partial'],['#7bc66a','The chat','buried'],['#e7c84d','The paper','unsure']];
  return html`<${Band} id="problem" cls="pad pp">
    <${SH} id="problem" sub="Problem statement" title=${html`Every question had three <span class="em">half</span> answers.`} lead="Ask anything about a deal and each place handed you a piece of it. Pick a question and see what came back."/>
    <div class="ask">
      <div class="ask-box rv" ref=${box} aria-live="polite">
        <div class="ask-in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><p class=${done?'':'typing'}>${text.slice(0,n)}</p><kbd>Enter</kbd></div>
        <div class=${'ask-res'+(done?' show':'')}>${src.map(([c,l,t],k)=>html`<div key=${l}><i style=${{background:c}}></i><b>${l}</b><span>${ASK[q][1][k]}</span><em>${t}</em></div>`)}</div>
        <div class="ask-foot"><span>3 places searched</span><strong>0 full answers</strong></div>
      </div>
      <div class="ask-qs rv" role="group" aria-label="Questions to try">${ASK.map(([t],k)=>html`<button key=${t} aria-pressed=${q===k} onClick=${()=>pick(k)}><b>Q${k+1}</b><span>${t}</span></button>`)}
        <p class="mono quiet" style=${{marginTop:'6px'}}>Illustration of the old workflow · fictional client</p></div>
    </div>
    <div class="brief rv"><span class="mono quiet">So the brief became</span>
      <p>Give an export deal <span class="em">one home</span>, without slowing down the people who close it.</p></div>
    <div class="pulls">${[['Speed','Control','Sales moves fast, management sees everything.','“My day” for the person, team filters for the manager.'],['Flexible','Consistent','Every deal is different, every document looks the same.','Any field can be edited, every PDF prints on one letterhead.'],['Complete','Simple','Everything a deal needs, nothing that feels heavy.','Twenty modules, folded into four menu groups.']].map(([a,b,p,r])=>html`<div class="pull rv" key=${a}><div class="ends"><span>${a}</span><span>${b}</span></div><div class="rope"></div><p>${p} <b>${r}</b></p></div>`)}</div>
  <//>`
}

/* 05 goals: promises and proof */
function Goals(){
  const g=[['Open it and know what to do first.','Tasks due, follow-ups and arriving shipments sit above every chart.','My day panel','g-myday','The My day panel listing tasks due and a shipment arriving this week',''],['One importer, one story.','Status, owner and the next follow-up share a single row. Late dates turn red.','CRM & Importers','g-crm','CRM rows with status, owner and follow-up dates',''],['Type a number once.','Packing and price arrive from the catalog, and the finished plan becomes a quotation.','Container Planner','g-planner','Container planner product row with packing and price filled in',''],['Sound like one company.','Same letterhead, same policy lines, in the buyer’s language. Every time.','Quotations','paper','Printed quotation on the company letterhead','doc']];
  return html`<section id="goals" class="band gl pad" aria-label="Goals"><div class="grain"></div>
    <div class="wrap">
      <${SH} id="goals" title=${html`Four promises, and the screens that <span class="em">keep</span> them.`} lead="A goal is easy to write and hard to prove. So each one here comes with its receipt: a real piece of the interface, on demo data."/>
      <div class="prom">${g.map(([t,p,by,img,alt,cls],k)=>html`<article class=${'pr rv '+cls} key=${t}>
        <div class="top"><span class="n">0${k+1}</span><span class="kept">✓ Kept</span></div>
        <h3>${t}</h3><p>${p}</p><span class="by">Proof · ${by}</span>
        <figure><img src=${H(img)} alt=${alt} loading="lazy"/></figure>
      </article>`)}</div>
    </div>
  </section>`
}

/* 06 before & after */
function Benchmark(){
  const rows=[['Client history','Split across files and chats','One record','Status, owner, next follow-up and activity together'],['Follow-ups','Kept in memory and reminders','My day','Due and overdue dates surface on the dashboard'],['Prices','A sheet per product line','One price list','Dated versions, with exchange rates beside them'],['Container load','Worked out by hand','Live planner','Pallet places and gross weight against the limit'],['Quotation','Rebuilt for each customer','Branded PDF','Letterhead, language and saved versions'],['Access','Whoever has the file','Seven roles','Enforced in the database, not just the menu']];
  return html`<${Band} id="benchmark" cls="pad">
    <${SH} id="benchmark" title=${html`Same jobs, a very different <span class="em">Monday</span>.`} tag="Retrospective summary" lead="The middle column is my summary of how the old spreadsheets, chats and paper handled each job. The right column is what is live today."/>
    <div class="mx-head mono quiet"><span>The job</span><span>Before</span><span>Now, in the platform</span></div>
    <div class="mx">${rows.map(([c,t,b,d])=>html`<div class="mx-row rv" key=${c}><h3>${c}</h3><span class="mx-typ">${t}</span><span class="mx-ms"><b>${b}</b>${d}</span></div>`)}</div>
  <//>`
}

/* 07 roles */
function Audience(){
  const qs=['What needs me today?','Who should I call, and is it overdue?','Where does this deal stand?','Will this load fit in one container?','Which quotation did the customer actually get?','Has the shipment left, and when does it land?','Who still owes us, and how much?'];
  return html`<${Band} id="audience" cls="pad sd">
    <${SH} id="audience" title=${html`Seven roles, <span class="em">one</span> front door.`} lead="Everyone signs in the same way. What opens after that depends on the job, and the database is the one that decides."/>
    <div class="who">${[['Super Admin','01'],['Sales Manager','02'],['Sales Officer','03'],['Logistics Officer','04'],['Finance Officer','05'],['Quality Officer','06'],['Viewer','07']].map(([w,n])=>html`<span class="rv" key=${w}><small>${n}</small>${w}</span>`)}</div>
    <div class="rv" style=${{...two,marginTop:'clamp(40px,5vw,72px)'}}>
      <figure style=${{margin:0}}><${Browser} src=${H('d-crm')} url="Signed in as Super Admin" alt="CRM page as Super Admin with all 10 demo companies"/><figcaption style=${capS}><span>Super Admin</span><b>All 10 companies</b></figcaption></figure>
      <figure style=${{margin:0}}><${Browser} src=${H('d-sales-crm')} url="Signed in as Sales Officer" alt="CRM page as Sales Officer with only their own 5 companies"/><figcaption style=${capS}><span>Sales Officer</span><b>Their own 5</b></figcaption></figure>
    </div>
    <//>`
}

/* 08 IA */
function IA(){
  return html`<${Band} id="ia" cls="pad fo">
    <${SH} id="ia" title=${html`A menu shaped like the <span class="em">deal</span>.`} lead="The sidebar is grouped the way the work moves: win the deal, move the goods, know what we sell. Admin sits quietly at the end."/>
    <div class="mn rv">
      <div class="mn-start"><span class="node root"><small>Everyone starts here</small>Dashboard</span></div>
      <div class="mn-grid">${[['Sales','Win the deal',['Market Research','CRM & Importers','Sales Pipeline','Quotations','Proforma Invoices']],['Operations','Move the goods',['Orders & Shipments','Container Planner','Shipping & Logistics','Payments']],['Products & Prices','Know what we sell',['Products','Pricing','Suppliers']],['Admin','Keep it in order',['Team & Roles','Company Settings','Activity Log','Archive']]].map(([g,s,items],k)=>html`<div class="mn-col" key=${g}>
        <div class="mn-h"><span class="mono">Group 0${k+1}</span><h3>${g}</h3><p>${s}</p></div>
        <ul>${items.map(i=>html`<li key=${i}>${i}</li>`)}</ul>
      </div>`)}</div>
    </div>
  <//>`

/* 09 decisions */

function Decisions(){

  useEffect(()=>{let raf=0; const pick=()=>{raf=0; const mid=innerHeight/2; let best=0,bd=1e9; refs.current.forEach((r,i)=>{ if(!r) return; const b=r.getBoundingClientRect(); const d=Math.abs((b.top+b.bottom)/2-mid); if(d<bd){bd=d;best=i} }); setA(v=>v===best?v:best)}; const on=()=>{ if(!raf) raf=requestAnimationFrame(pick)}; addEventListener('scroll',on,{passive:true}); addEventListener('resize',on); on(); return()=>{removeEventListener('scroll',on);removeEventListener('resize',on)}},[]);
  return html`<${Band} id="decisions" cls="pad pp">
    <${SH} id="decisions" title=${html`Six decisions that <span class="em">shaped</span> it.`} tag="Rationale in my own words" lead="What was built is in the live system. The one-line why beside each is how I reasoned about it."/>

    <//>`

/* chrome */
function Chrome({exp,setExp}){
  const [cur,setCur]=useState('cover'); const [open,setOpen]=useState(false);
  useEffect(()=>{const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) setCur(e.target.id)}),{rootMargin:'-49% 0px -50% 0px'}); SECTIONS.forEach(([id])=>{const el=document.getElementById(id); el&&o.observe(el)}); return()=>o.disconnect()},[]);
  useEffect(()=>{const k=e=>{if(e.key==='Escape')setOpen(false)}; addEventListener('keydown',k); return()=>removeEventListener('keydown',k)},[]);
  return html`<${Fragment}>
    <div class="topbar" aria-hidden="true"><b></b></div>
    <div class="hud">
      <span style=${{display:'flex',gap:'8px'}}><a class="pill-btn" href="../index.html" style=${{textDecoration:'none'}}>← Portfolio</a><button class="pill-btn" onClick=${()=>setOpen(true)} aria-haspopup="dialog"><span class="cur">${nn(cur)}</span>${lab(cur)}</button></span>
      <button class="pill-btn keep" onClick=${()=>setExp(!exp)} aria-pressed=${exp} title="Hide interface for clean screenshots">${exp?'Show UI':'Export view'}</button>
    </div>
    ${open?html`<div class="sheet" role="dialog" aria-label="Chapters"><div class="wrap"><div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span class="mono" style=${{color:'var(--lime)'}}>${SECTIONS.length} chapters</span><button class="pill-btn" onClick=${()=>setOpen(false)}>Close</button></div>
      <ol>${SECTIONS.map(([id,l],k)=>html`<li key=${id}><a href=${'#'+id} onClick=${()=>setOpen(false)}><b>${String(k+1).padStart(2,'0')}</b>${l}</a></li>`)}</ol></div></div>`:null}
  <//>`
}

function App(){
  const [exp,setExp]=useState(false);
  useScrollEngine();
  useEffect(()=>{document.body.classList.toggle('export',exp)},[exp]);
  useEffect(()=>{ if(reduce) return; const vh=innerHeight;
    const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.rv,.clip').forEach(el=>{ if(el.getBoundingClientRect().top>vh && !el.closest('.film,.hg,.fps')) o.observe(el)}); return()=>o.disconnect()},[]);
  return html`<${Fragment}><${Chrome} exp=${exp} setExp=${setExp}/><main>
    <${Cover}/><${Overview}/><${Context}/><${Problem}/><${Goals}/><${Audience}/><${IA}/><${Decisions}/><${System}/>
    <${Modes}/><${Responsive}/><${HiFi}/><${Outcomes}/><${Thanks}/>
  </main><//>`
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
