<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* responsive pass: tiny phones, short screens, very large screens */
.spec-art{overflow:hidden}
.hg .card{flex-basis:clamp(280px,min(52vw,calc((100svh - 320px)*1.6)),900px)}
.hg .card.ph{flex-basis:clamp(150px,min(17vw,calc((100svh - 330px)*.46)),280px)}
.dec-stage{max-width:calc((100svh - 22vh)*1.5)}
.fps .screen .browser .vp{height:min(72svh,680px)}
@media (max-width:600px){.hud .pill-btn.keep{display:none}.pill-btn{padding:10px 12px;font-size:10px}}
@media (max-width:420px){.cv-foot{grid-template-columns:1fr}.ov-figs{grid-template-columns:1fr 1fr}.big{font-size:clamp(58px,17vw,76px)}.lrn li{grid-template-columns:1fr}.qflow{grid-template-columns:1fr 1fr}.parade{grid-template-columns:repeat(2,minmax(0,1fr))}.lineup{grid-template-columns:1fr}.lineup .lp:nth-child(n+3){display:none}.flav,.toks{grid-template-columns:1fr}.specs{grid-template-columns:1fr}.months button{padding:8px 7px}}
@media (max-height:620px) and (min-width:900px){.film .copy,.film .counter{bottom:90px}.hg .hg-head h2{font-size:clamp(30px,3vw,48px)}}
@media (min-width:1800px){:root{--wrap:1560px}body{font-size:18px}.lead{font-size:23px}}
@media (min-width:2400px){:root{--wrap:1880px}body{font-size:20px}.d2{font-size:clamp(50px,8vw,170px)}.d3{font-size:96px}.lead{font-size:26px}.mono{font-size:13px}}
.wfm{min-width:0}.wfm .fx{flex-wrap:wrap}.wfm .fx>.bx{min-width:0}.wfm .t{flex-wrap:wrap;gap:6px}

/* simple cover */
.cv2{background:var(--forest-2);color:var(--on-dark);overflow:hidden}
.cv2 .wrap{padding-top:clamp(22px,3vw,36px)}
.cv2-mid{display:grid;gap:clamp(18px,2.4vw,28px);justify-items:center;text-align:center;padding-top:clamp(64px,9vw,130px)}
.cv2-h{font-size:clamp(56px,9.5vw,160px);line-height:.9;letter-spacing:-.03em}
.cv2-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:clamp(44px,5vw,72px) auto 0;max-width:980px;border-top:1px solid var(--line-dark)}
.cv2-meta div{padding:16px 12px 0;display:grid;gap:6px;text-align:center}
.cv2-meta dt{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2)}
.cv2-meta dd{margin:0;font-size:15px}
.cv2-shot{max-width:1120px;margin:clamp(48px,6vw,90px) auto 0;margin-bottom:calc(-1 * clamp(80px,14vw,240px))}
.cv2-shot .browser{box-shadow:0 -10px 60px -10px rgba(198,246,141,.12),0 40px 100px -30px rgba(0,0,0,.6)}
.cv2+section{position:relative;z-index:1}
@media (max-width:700px){.cv2-meta{grid-template-columns:1fr 1fr;row-gap:18px}.cv2-shot{margin-bottom:-40px}}
</style>

<style>
/* Layout concept: a film in chapters. Full-bleed photographic "plates" (scroll-pinned, parallax) alternate with quiet ivory spreads set like a printed monograph. Brand forest + lime carry everything; Instrument Serif speaks, mono annotates. */
:root{
  --forest:#0f3d1e; --forest-2:#08240f; --forest-3:#143a21; --night:#051a0b;
  --ivory:#f5f0e6; --paper:#fbf8f1; --sand:#ebe3d2;
  --ink:#16221a; --muted:#5d685a; --line:#d8cfbb;
  --lime:#c7f78a; --olive:#6f9640; --mint:#dff0cf;
  --on-dark:#eef2e6; --on-dark-2:#9fb19a; --line-dark:rgba(238,242,230,.14);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-brand:"DM Serif Display",Georgia,serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wrap:1320px; --gut:max(16px, env(safe-area-inset-left,0px)); --gutr:max(16px, env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.16,.84,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--night)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px;border-radius:4px}
.dk :focus-visible{outline-color:var(--lime)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:.95;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.band{position:relative;padding-left:var(--gut);padding-right:var(--gutr)}
.wrap{max-width:var(--wrap);margin:0 auto;position:relative}
.dk{background:var(--forest-2);color:var(--on-dark)}
.fo{background:var(--forest);color:var(--on-dark)}
.pp{background:var(--paper)}
.sd{background:var(--sand)}
.pad{padding-block:clamp(88px,12vw,180px)}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.em{font-style:italic;color:var(--olive)}
.dk .em,.fo .em,.plate .em{color:var(--lime)}
.quiet{color:var(--muted)}
.dk .quiet,.fo .quiet,.plate .quiet{color:var(--on-dark-2)}
.ch{display:flex;align-items:baseline;gap:14px;color:var(--olive)}
.dk .ch,.fo .ch,.plate .ch{color:var(--lime)}
.ch b{font-weight:500}
.ch i{flex:0 0 48px;height:1px;background:currentColor;opacity:.5;align-self:center}
.ch span{color:var(--muted)}
.dk .ch span,.fo .ch span,.plate .ch span{color:var(--on-dark-2)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid currentColor;border-radius:999px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dk .tag,.fo .tag,.plate .tag{color:var(--on-dark-2)}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--olive)}
.dk .tag::before,.fo .tag::before,.plate .tag::before{background:var(--lime)}
.d1{font-size:clamp(68px,13vw,236px);line-height:.84;letter-spacing:-.03em}
.d2{font-size:clamp(50px,8vw,136px);line-height:.88;letter-spacing:-.025em}
.d3{font-size:clamp(38px,5vw,80px);line-height:.92}
.d4{font-size:clamp(28px,2.8vw,40px);line-height:1}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.5;max-width:44ch}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:var(--noise);z-index:2}
.ghost{position:absolute;font-family:var(--f-display);font-size:clamp(200px,32vw,560px);line-height:.7;color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none;user-select:none;z-index:0}
.dk .ghost,.fo .ghost{-webkit-text-stroke-color:rgba(238,242,230,.08)}

/* frames */
.browser{border-radius:12px;overflow:hidden;background:#0b1c10;box-shadow:0 2px 0 rgba(255,255,255,.04) inset,0 50px 100px -40px rgba(4,20,8,.75),0 18px 40px -20px rgba(4,20,8,.5)}
.browser .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#10261a}
.browser .bar span{width:8px;height:8px;border-radius:50%;background:#2c4733}
.browser .bar em{margin:0 auto;font-style:normal;font:400 10.5px var(--f-mono);color:#7f9785;background:#0b1c10;border-radius:999px;padding:3px 14px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.phone{width:100%;border-radius:15%/7%;padding:3.2%;background:#0a170e;box-shadow:inset 0 0 0 1.5px #2a3e2f,0 50px 90px -40px rgba(4,20,8,.8)}
.phone img{border-radius:12%/5.6%;width:100%;aspect-ratio:390/844;object-fit:cover;object-position:top}
.tablet{width:100%;border-radius:6%/4.2%;padding:3%;background:#0a170e;box-shadow:inset 0 0 0 1.5px #2a3e2f,0 50px 90px -40px rgba(4,20,8,.8)}
.tablet img{border-radius:3%/2%;width:100%;aspect-ratio:664/955;object-fit:cover;object-position:top}
.tilt-l{transform:perspective(2200px) rotateY(16deg) rotateX(4deg);transform-origin:left center}
.tilt-r{transform:perspective(2200px) rotateY(-16deg) rotateX(4deg);transform-origin:right center}
figure{margin:0}
figcaption.cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.dk figcaption.cap,.fo figcaption.cap,.plate figcaption.cap{color:var(--on-dark-2)}
figcaption.cap b{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
.dk figcaption.cap b,.fo figcaption.cap b{color:var(--lime)}

/* reveal: visible at rest; animates only for elements entering later */
.rv.in{animation:rise 1.1s var(--ease) both}
.clip.in{animation:unclip 1.4s var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes unclip{from{clip-path:inset(18% 8% 18% 8% round 14px);transform:scale(1.06)}to{clip-path:inset(0 0 0 0 round 0);transform:none}}

/* chrome */
.topbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;z-index:70;pointer-events:none}
.topbar b{display:block;height:100%;width:0;background:var(--lime)}
.hud{position:fixed;z-index:71;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.hud>*{pointer-events:auto}
.pill-btn{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(199,247,138,.35);background:rgba(5,26,11,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--on-dark);border-radius:999px;padding:12px 16px;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.pill-btn:hover{border-color:var(--lime);color:var(--lime)}
.pill-btn .cur{color:var(--lime)}
.export .hud .pill-btn:not(.keep),.export .topbar{display:none}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(5,26,11,.97);color:var(--on-dark);padding:max(28px,env(safe-area-inset-top,0px)) var(--gutr) 28px var(--gut);overflow:auto;animation:fadein .35s var(--ease)}
@keyframes fadein{from{opacity:0}}
.sheet .wrap{display:grid;gap:28px}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 32px}
.sheet a{display:flex;gap:16px;align-items:baseline;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line-dark);font-family:var(--f-display);font-size:26px;line-height:1.1}
.sheet a b{font:500 11px var(--f-mono);color:var(--lime);min-width:24px}
.sheet a:hover{color:var(--lime)}

/* 01 cover */
.cover{min-height:min(980px,96svh);display:flex;overflow:hidden;background:var(--night);color:var(--on-dark)}
.cover .bg{position:absolute;inset:-6% 0;background:url(img/scene-tropical.webp) 62% center/cover;animation:kenburns 22s ease-out both;will-change:transform}
@keyframes kenburns{from{transform:scale(1.18)}to{transform:scale(1.02)}}
.cover .shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 40%,transparent 0%,rgba(5,26,11,.25) 40%,rgba(5,26,11,.9) 78%),linear-gradient(0deg,rgba(5,26,11,.95) 0%,transparent 45%)}
.cover .wrap{width:100%;display:flex;flex-direction:column;padding-block:clamp(22px,3vw,36px) clamp(40px,5vw,64px);z-index:3}
.cv-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.cv-top img{height:clamp(30px,3vw,42px);width:auto}
.cv-mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(22px,3vw,40px);padding-top:clamp(120px,16vw,220px)}
.cover h1 span{display:block}
.cover h1 .em{margin-left:clamp(40px,9vw,170px)}
.cv-foot{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid var(--line-dark);padding-top:20px;align-items:start}
.cv-foot dl{margin:0;display:grid;gap:6px}
.cv-foot dt{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-2)}
.cv-foot dd{margin:0;font-size:15px}
@media (max-width:860px){.cv-foot{grid-template-columns:1fr 1fr}.cv-foot .lead{grid-column:1/-1}}
.floaty{position:absolute;z-index:3;filter:drop-shadow(0 40px 40px rgba(0,0,0,.5));will-change:transform;pointer-events:none}
@media (max-width:860px){.floaty{display:none}}

/* 02 overview */
.ov{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(40px,7vw,120px);align-items:end}
.ov-figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:clamp(48px,6vw,80px)}
.ov-figs div{border-top:1px solid var(--ink);padding:16px 18px 28px 0;display:grid;gap:6px}
.big{font-family:var(--f-display);font-size:clamp(76px,9vw,150px);line-height:.8;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov-img{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:2px}
.ov-img img{width:100%;height:118%;object-fit:cover;position:absolute;top:-9%}
.pages{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:1px solid var(--line)}
.pages span{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px 12px 0;color:var(--muted)}
.pages span+span::before{content:"/";margin-right:16px;color:var(--line)}
@media (max-width:900px){.ov{grid-template-columns:1fr}}

/* 03 context mosaic */
.mosaic{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(70px,8vw,120px);gap:clamp(8px,1vw,14px)}
.mosaic figure{position:relative;overflow:hidden;border-radius:3px}
.mosaic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.mosaic figure:hover img{transform:scale(1.05)}
.mosaic figcaption{position:absolute;left:12px;bottom:10px;font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.lines3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(56px,7vw,96px)}
.lines3 div{display:grid;gap:10px;border-top:1px solid var(--line-dark);padding-top:18px}
@media (max-width:860px){.mosaic{grid-auto-rows:64px}.mosaic figure{grid-column:span 6!important;grid-row:span 3!important}.mosaic figure:first-child{grid-column:span 12!important}.lines3{grid-template-columns:1fr}}

/* 04 problem */
.hmw{font-family:var(--f-display);font-size:clamp(44px,7.2vw,124px);line-height:.92;letter-spacing:-.025em;max-width:16ch;margin:0}
.tens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(64px,8vw,120px)}
.tens div{display:grid;gap:10px;align-content:start}
.tens .pair{font-family:var(--f-display);font-size:clamp(34px,3.4vw,52px);line-height:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tens .pair i{font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:4px 8px;font-style:normal}
.tens p{font-size:15px;color:var(--muted);max-width:34ch}
@media (max-width:860px){.tens{grid-template-columns:1fr}}

/* 05 goals over plate */
.plate{position:relative;overflow:hidden;color:var(--on-dark);background:var(--night)}
.plate .pbg{position:absolute;inset:-12% 0;background-size:cover;background-position:center;will-change:transform}
.plate .pshade{position:absolute;inset:0}
.plate .wrap{z-index:3}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(56px,7vw,100px)}
.goal{border-left:1px solid var(--line-dark);padding:4px clamp(14px,2vw,28px) 8px;display:grid;gap:14px;align-content:start}
.goal .gk{font-family:var(--f-display);font-size:clamp(34px,3.4vw,52px);line-height:.95}
.goal p{font-size:14.5px;color:var(--on-dark-2)}
.goal .by{margin-top:10px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime);line-height:1.6}
@media (max-width:980px){.goals{grid-template-columns:1fr 1fr;row-gap:36px}}
@media (max-width:560px){.goals{grid-template-columns:1fr}}

/* 06 benchmark matrix */
.mx{display:grid;border-top:1px solid var(--ink)}
.mx-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,48px);padding:clamp(20px,2.4vw,30px) 0;border-bottom:1px solid var(--line);align-items:center}
.mx-row h3{font-size:clamp(28px,2.8vw,42px)}
.mx-typ{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14.5px}
.mx-typ::before{content:"";flex:0 0 10px;height:10px;border-radius:50%;border:1.5px solid #a7ad9f}
.mx-ms{display:flex;align-items:center;gap:14px;font-size:14.5px}
.mx-ms b{flex:0 0 auto;background:var(--forest);color:var(--lime);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
.mx-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,48px);padding-bottom:14px}
@media (max-width:860px){.mx-row,.mx-head{grid-template-columns:1fr}.mx-head span:not(:first-child){display:none}.mx-ms{flex-wrap:wrap}}

/* 07 audience */
.who{display:grid;gap:0}
.who span{font-family:var(--f-display);font-size:clamp(54px,9vw,156px);line-height:.92;letter-spacing:-.03em;display:flex;align-items:baseline;gap:20px;border-bottom:1px solid var(--line);padding-block:4px 10px;transition:color .4s,padding .5s var(--ease)}
.who span small{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--olive);text-transform:uppercase}
.who span:hover{color:var(--olive);padding-left:24px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 32px;margin-top:clamp(56px,6vw,88px)}
.qs div{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line);font-size:15.5px}
.qs b{font:500 11px var(--f-mono);color:var(--olive);padding-top:4px}

/* 08 IA */
.ia{overflow-x:auto;padding-bottom:6px;margin-top:clamp(40px,6vw,72px)}
.tree{min-width:900px;display:grid;justify-items:center}
.node{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:12px 20px;border-radius:999px;border:1px solid var(--line-dark);font-size:15px;white-space:nowrap;background:rgba(238,242,230,.03)}
.node small{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2)}
.node.root{background:var(--lime);color:var(--forest-2);border:0;font-weight:600;padding:14px 28px}
.node.root small{color:var(--forest)}
.node.cta{border:1.5px dashed var(--lime);color:var(--lime)}
.row{display:flex;justify-content:center;gap:40px;position:relative;padding-top:34px;margin-top:34px}
.row::before{content:"";position:absolute;top:0;left:16%;right:13%;height:1px;background:var(--line-dark)}
.row::after{content:"";position:absolute;top:-34px;left:50%;width:1px;height:34px;background:var(--line-dark)}

.w{position:absolute;border:1.5px solid #8e9889;border-radius:6px;background:rgba(251,248,241,.9)}

.season span{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--paper);color:var(--ink);font:500 13.5px "Inter",sans-serif;animation:pop .5s var(--ease) both}
.season span i{width:28px;height:28px;border-radius:50%;background:var(--mint) center/cover no-repeat}
.season span.v i{background-color:#eae4d4}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(6px)}}
@media (max-width:900px){.mo>*{grid-column:1/-1!important}}

/* 18 outcomes */
.oc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(40px,6vw,100px)}
.ship{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.ship div{border-top:1px solid var(--ink);padding:14px 0 30px;display:grid;gap:4px}
.ship .big{color:var(--forest)}
.lrn{list-style:none;margin:0;padding:0}
.lrn li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.lrn li b{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);padding-top:8px}
.lrn h3{font-size:clamp(28px,2.6vw,38px);margin-bottom:6px}
.lrn p{font-size:15px;color:var(--muted);max-width:52ch}
@media (max-width:900px){.oc{grid-template-columns:1fr}.lrn li{grid-template-columns:1fr;gap:6px}}

/* 19 showcase */
.sc{position:relative;overflow:hidden;background:var(--night);color:var(--on-dark)}
.sc .pbg{position:absolute;inset:-12% 0;background:url(img/scene-global.webp) center/cover;will-change:transform}
.sc .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,26,11,.9) 0%,rgba(5,26,11,.4) 38%,rgba(5,26,11,.55) 70%,rgba(5,26,11,.95))}
.sc .wrap{z-index:3;padding-block:clamp(88px,11vw,160px)}
.stack3{position:relative;height:clamp(420px,58vw,820px);margin-top:clamp(40px,5vw,80px);perspective:2400px}
.stack3>*{position:absolute}
.stack3 .s1{width:62%;left:0;top:14%;transform:rotateY(18deg) rotateX(6deg) rotateZ(-1deg);transform-origin:left center}
.stack3 .s2{width:60%;left:22%;top:0;z-index:2;transform:rotateX(6deg)}
.stack3 .s3{width:52%;right:0;top:24%;z-index:1;transform:rotateY(-20deg) rotateX(6deg);transform-origin:right center}
.stack3 .s4{width:17%;right:9%;bottom:-2%;z-index:4}
@media (max-width:760px){.stack3{height:auto;display:grid;gap:16px;perspective:none}.stack3>*{position:relative;width:100%!important;left:auto!important;right:auto!important;top:auto!important;transform:none!important}.stack3 .s1,.stack3 .s3{display:none}.stack3 .s4{width:46%!important;justify-self:center}}

/* 20 thanks */
.ty{min-height:min(860px,92svh);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.ty .wrap{flex:1;display:flex;flex-direction:column;justify-content:space-between;width:100%;padding-block:clamp(72px,9vw,120px) clamp(80px,9vw,120px)}
.ty h2{font-size:clamp(96px,21vw,380px);line-height:.78;letter-spacing:-.04em}
.ty .row3{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--line-dark);padding-top:22px}
.ty a.live{font-family:var(--f-display);font-size:clamp(30px,3.2vw,52px);text-decoration:none;background:linear-gradient(var(--lime),var(--lime)) 0 100%/0 1px no-repeat;transition:background-size .6s var(--ease)}
.ty a.live:hover{background-size:100% 1px;color:var(--lime)}
.ty .floaty{opacity:.95}

.sh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:end;margin-bottom:clamp(48px,6vw,96px);position:relative;z-index:1}
.sh .l{display:grid;gap:clamp(18px,2vw,28px)}
.sh .r{display:grid;gap:16px;justify-items:start}
@media (max-width:900px){.sh{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .xf img:first-child{opacity:1}
}

/* ---- v3 additions ---- */
.live-tag{display:inline-flex;align-items:center;gap:8px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#d9efc2}
.live-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5d4f;box-shadow:0 0 0 4px rgba(255,93,79,.25);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* hero film with live captures */
.film .scn img{object-position:center top}
.film .scn::after{background:linear-gradient(180deg,rgba(5,26,11,.55) 0%,transparent 18%,transparent 78%,rgba(5,26,11,.6))}
.film .side{position:absolute;z-index:4;right:max(var(--gutr),calc((100% - var(--wrap))/2));top:50%;transform:translateY(-50%);display:grid;gap:4px}
.film .side button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:12px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:6px 0}
.film .side button i{width:18px;height:2px;background:currentColor;border-radius:2px;transition:width .5s var(--ease)}
.film .side button[aria-current="true"]{color:var(--lime)}
.film .side button[aria-current="true"] i{width:44px}
.film .side button:focus-visible{outline:2px solid var(--lime)}
.film .scrub{position:absolute;z-index:4;left:max(var(--gut),calc((100% - var(--wrap))/2));right:max(var(--gutr),calc((100% - var(--wrap))/2));bottom:max(22px,env(safe-area-inset-bottom,0px));height:2px;background:rgba(255,255,255,.18)}
.film .scrub i{display:block;height:100%;width:0;background:var(--lime)}
@media (max-width:900px){.film .side{display:none}}

/* timeline scrubber */
.tlx{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:center}
.tl-prev{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.tl-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tl-prev .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.tl{position:relative;margin-top:22px}
.tl .lane{position:relative;height:30px;margin-bottom:6px}
.tl .lane span{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;padding-inline:8px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.tl .lane.sc span{background:rgba(199,247,138,.16);border:1px solid rgba(199,247,138,.4);color:var(--on-dark)}
.tl .lane.tx span{background:rgba(238,242,230,.08);color:var(--on-dark-2);height:16px;top:7px}
.tl .lane.ef span{background:rgba(255,194,14,.18);color:#ffd970;height:16px;top:7px;padding-inline:4px}
.tl .lane.sc span.on{background:var(--lime);color:var(--forest-2);border-color:var(--lime)}
.tl .ll{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-2);margin:12px 0 6px}
.tl .ph{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--lime);transform:translateX(-1px);pointer-events:none;box-shadow:0 0 12px var(--lime)}
.tl .ax{display:flex;justify-content:space-between;font:400 10px var(--f-mono);color:var(--on-dark-2);margin-top:8px}
.tl-range{width:100%;margin-top:18px;accent-color:#c6f68d}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(48px,6vw,80px);border-top:1px solid var(--line-dark)}
.specs div{padding:18px 18px 0 0;display:grid;gap:6px;align-content:start}
.specs b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,3.4vw,54px);line-height:1;color:var(--lime)}
.specs span{font-size:13.5px;color:var(--on-dark-2)}
@media (max-width:900px){.tlx{grid-template-columns:1fr}.specs{grid-template-columns:1fr 1fr;row-gap:24px}}

/* videos */
.vid{position:relative;border-radius:12px;overflow:hidden;background:#000}
.vid video{display:block;width:100%;height:auto}
.vid .live-tag{position:absolute;left:14px;top:12px;z-index:2;background:rgba(5,26,11,.7);padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.mo2{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(14px,1.8vw,26px);align-items:start}
.mo2 figure{display:grid;gap:14px}
.mo2 .cap2{display:grid;gap:6px}
.mo2 .cap2 h3{font-size:clamp(26px,2.4vw,36px)}
.mo2 .cap2 p{font-size:13.5px;color:var(--on-dark-2);max-width:48ch}
.mo2 .cap2 code{font:500 10.5px var(--f-mono);color:var(--lime);letter-spacing:.04em}
@media (max-width:900px){.mo2>*{grid-column:1/-1!important}.mo2 .mob{max-width:300px;justify-self:center}}
.ease{display:flex;gap:clamp(16px,3vw,48px);align-items:center;flex-wrap:wrap;margin-top:clamp(40px,5vw,72px);border-top:1px solid var(--line-dark);padding-top:24px}
.ease svg{flex:0 0 auto}
.ease .cb{font:500 clamp(16px,1.6vw,22px) var(--f-mono);color:var(--lime)}

/* quote flow strip */
.qflow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:clamp(56px,7vw,100px);align-items:start}
.qflow figure{display:grid;gap:10px}
.qflow .qi{height:clamp(170px,17vw,250px);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.qflow .qi img{width:100%;height:100%;object-fit:cover;object-position:top left}
.qflow span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2)}
.qflow b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--on-dark);display:block}
@media (max-width:900px){.qflow{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* palettes */
.flav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin-top:clamp(14px,2vw,24px)}
.flav div{border-radius:4px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;min-height:200px;overflow:hidden}
.flav img{height:150px;width:auto;margin-bottom:-24px;filter:drop-shadow(0 16px 18px rgba(0,0,0,.18))}
.flav p{font-family:var(--f-brand);font-size:22px;line-height:1.05}
.flav small{display:block;font:500 10px var(--f-mono);letter-spacing:.06em;margin-top:8px;opacity:.75}
.toks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,24px);margin-top:clamp(14px,2vw,24px)}
.tok{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:10px;align-content:start}
.tok .k{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tok .v{font-family:var(--f-display);font-size:28px;line-height:1.05}
.tok .v code{font:500 14px var(--f-mono);color:var(--olive)}
@media (max-width:900px){.flav,.toks{grid-template-columns:1fr 1fr}}

/* phone parade */
.parade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(10px,1.6vw,26px);margin-top:clamp(56px,7vw,110px);position:relative;z-index:2;align-items:start}
.parade figure:nth-child(even){margin-top:clamp(30px,5vw,80px)}
.parade figcaption{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2);margin-top:10px;text-align:center}
@media (max-width:900px){.parade{grid-template-columns:repeat(3,minmax(0,1fr))}.parade figure:nth-child(even){margin-top:24px}}

/* page lineup with auto-scrolling pages */
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);align-items:start}
.lp{display:grid;gap:12px}
.lp .win{height:clamp(360px,40vw,580px);overflow:hidden;border-radius:10px;background:#fff;box-shadow:0 40px 70px -40px rgba(15,61,30,.55);position:relative}
.lp .win img{width:100%;height:auto;animation:pagescroll var(--d,26s) ease-in-out infinite alternate;animation-play-state:paused}
.lp:hover .win img,.lineup.play .win img{animation-play-state:running}
@keyframes pagescroll{0%,6%{transform:translateY(0)}94%,100%{transform:translateY(calc(-100% + var(--wh,580px)))}}
.lp .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lp h3{font-size:clamp(22px,1.8vw,28px)}
.lp span{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
@media (max-width:900px){.lineup{grid-template-columns:repeat(2,minmax(0,1fr))}.lineup .lp:last-child{display:none}}

/* pinned full-page homepage scroll */
.fps{position:relative;background:var(--night);color:var(--on-dark)}
.fps .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:clamp(24px,4vw,64px);align-items:center;padding-inline:max(var(--gut),calc((100vw - var(--wrap))/2))}
.fps .pbg{position:absolute;inset:-10% 0;background:url(img/scene-global.webp) center/cover;opacity:.32;filter:saturate(1.1)}
.fps .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 10%,rgba(5,26,11,.6))}
.fps .txt{position:relative;z-index:2;display:grid;gap:22px}
.fps .screen{position:relative;z-index:2}
.fps .screen .browser .vp{height:min(72vh,640px);overflow:hidden;background:#fff}
.fps .screen .browser .vp img{width:100%;height:auto;aspect-ratio:auto;object-fit:initial;will-change:transform}
.fps .meter{display:flex;gap:4px;margin-top:6px}
.fps .meter i{flex:1;height:2px;background:var(--line-dark)}
.fps .meter i.on{background:var(--lime)}
.fps .secs{display:grid;gap:4px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2)}
.fps .secs span.on{color:var(--lime)}
.fps.nopin .stick{position:relative;height:auto;padding-block:clamp(88px,12vw,160px);grid-template-columns:1fr}
.fps.nopin .vp{overflow-y:auto!important}

/* engineering */
.eng{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(56px,7vw,100px);border-top:1px solid var(--ink)}
.eng div{padding:20px 20px 26px 0;display:grid;gap:8px;align-content:start;border-bottom:1px solid var(--line)}
.eng b{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,4.4vw,72px);line-height:.9;color:var(--forest)}
.eng span{font-size:14px;color:var(--muted)}
@media (max-width:900px){.eng{grid-template-columns:1fr 1fr}}

.lineup{--wh:clamp(360px,40vw,580px)}
.lp .win{height:var(--wh)}
.browser .bar{height:34px;padding:0 12px}
.ov-pins{position:absolute;left:0;right:0;bottom:0;top:34px;pointer-events:none}
.legend.l5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.legend.l5{grid-template-columns:1fr 1fr}}

<body>
<div id="app"></div>
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef,Fragment} = React;
const html = htm.bind(React.createElement);
const I = n => `img/${n}.webp`;
const H = n => `hi/${n}.webp`;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => innerWidth < 900;

(()=>{try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);document.documentElement.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}})();

const SECTIONS=[['cover','Cover'],['overview','Overview'],['context','Context'],['problem','Problem'],['goals','Goals'],['benchmark','Benchmark'],['audience','Audience'],['ia','Journey & IA'],['decisions','Decisions'],['wireframes','Wireframes'],['system','Design system'],['hero','Hero film'],['products','Product discovery'],['navigation','Navigation'],['responsive','Responsive'],['hifi','UI showcase'],['motion','Motion'],['outcomes','Outcomes'],['showcase','Final showcase'],['thanks','Thank you']];
const nn = id => String(SECTIONS.findIndex(s=>s[0]===id)+1).padStart(2,'0');
const lab = id => SECTIONS.find(s=>s[0]===id)[1];

/* scroll engine */
const pinSubs = new Set();
function useScrollEngine(){
  useEffect(()=>{
    if(reduce) return;
    let raf=0;
    const tick=()=>{raf=0; const vh=innerHeight;
      document.querySelectorAll('[data-par]').forEach(el=>{const r=el.parentElement.getBoundingClientRect(); if(r.bottom<-200||r.top>vh+200) return; el.style.transform=`translate3d(0,${((r.top+r.height/2)-vh/2)*(+el.dataset.par)}px,0)`});
      pinSubs.forEach(fn=>fn(vh));
      const h=document.documentElement; const b=document.querySelector('.topbar b'); if(b) b.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
    };
    const on=()=>{if(!raf) raf=requestAnimationFrame(tick)};
    addEventListener('scroll',on,{passive:true}); addEventListener('resize',on); on();
    return()=>{removeEventListener('scroll',on);removeEventListener('resize',on)};
  },[]);
}
function usePin(ref,cb){
  useEffect(()=>{
    const fn=vh=>{const el=ref.current; if(!el||el.classList.contains('nopin')) return; const r=el.getBoundingClientRect(); const span=r.height-vh; const p=span>0?Math.min(1,Math.max(0,-r.top/span)):0; cb(p,el)};
    pinSubs.add(fn); return()=>pinSubs.delete(fn);
  },[]);
}
function usePinnable(){ const [pin,setPin]=useState(!reduce&&!narrow()); useEffect(()=>{const f=()=>setPin(!reduce&&!narrow()); addEventListener('resize',f); return()=>removeEventListener('resize',f)},[]); return pin }

/* shared */
const Ch = ({id,children}) => html`<div class="mono ch"><b>${nn(id)}</b><i></i><span>${children||lab(id)}</span></div>`;
function SH({id,title,lead,tag,sub}){
  return html`<div class="sh">
    <div class="l rv">${id?html`<${Ch} id=${id}>${sub}<//>`:null}<h2 class="d2">${title}</h2></div>
    <div class="r rv">${tag?html`<span class="tag">${tag}</span>`:null}${lead?html`<p class="lead quiet">${lead}</p>`:null}</div>
  </div>`
}
const Browser = ({src,url='msgroup-egy.com',alt,cls=''}) => html`<div class=${'browser '+cls}><div class="bar"><span></span><span></span><span></span><em>${url}</em></div><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Phone = ({src,alt,cls=''}) => html`<div class=${'phone '+cls}><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Tablet = ({src,alt}) => html`<div class="tablet"><img src=${src} alt=${alt} loading="lazy" decoding="async"/></div>`;
const Band = ({id,cls='',children,label}) => html`<section id=${id} class=${'band '+cls} aria-label=${label||lab(id)}><div class="wrap">${children}</div></section>`;
function Vid({src,poster,label,cls=''}){
  const r=useRef();
  useEffect(()=>{ const v=r.current; if(!v||reduce) return; const o=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ const p=v.play(); p&&p.catch(()=>{}) } else v.pause() },{threshold:.25}); o.observe(v); return()=>o.disconnect()},[]);
  return html`<div class=${'vid '+cls}><span class="live-tag">${label||'Screen recording'}</span><video ref=${r} src=${src} poster=${poster} muted loop playsinline preload="metadata" controls=${reduce} aria-label=${label}></video></div>`
}

/* 01 cover */
function Cover(){
  return html`<section id="cover" class="band cv2" aria-label="Cover">
    <div class="wrap">
      <div class="cv-top"><img src=${H('logo-white')} alt="MS El Brancy Group"/><span class="tag">UI/UX case study</span></div>
      <div class="cv2-mid">
        <span class="mono" style=${{color:'var(--lime)'}}>Agricultural export · B2B website</span>
        <h1 class="cv2-h">MS El Brancy <span class="em">Group</span></h1>
        <p class="lead" style=${{color:'var(--on-dark-2)',margin:'0 auto'}}>A new website for an Egyptian grower, packer and exporter of fresh, frozen and preserved produce.</p>
      </div>
      <dl class="cv2-meta">
        <div><dt>Role</dt><dd>UI/UX design & build</dd></div>
        <div><dt>Tools</dt><dd>Figma · Codex · Claude Code</dd></div>
        <div><dt>Timeline</dt><dd>1 month</dd></div>
        <div><dt>Status</dt><dd>Live · msgroup-egy.com</dd></div>
      </dl>
      <div class="cv2-shot"><${Browser} src=${H('d-home-hero-tropical')} alt="MS El Brancy Group homepage"/></div>
    </div>
  </section>`
}

/* 02 overview */
function Overview(){
  return html`<${Band} id="overview" cls="pad">
    <div class="ov">

function opac(p,k){const [,,a,b]=SCN[k]; if(p<a||p>b) return 0; const prevEnd=k>0?SCN[k-1][3]:a; const nextStart=k<4?SCN[k+1][2]:b; let o=1; if(k>0&&p<prevEnd) o=Math.min(o,(p-a)/(prevEnd-a)); if(k<4&&p>nextStart) o=Math.min(o,(b-p)/(b-nextStart)); return Math.max(0,Math.min(1,o))}

}

function App(){
